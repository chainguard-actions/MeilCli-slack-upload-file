name: Report

on:
  workflow_run:
    workflows: ['CI-Master', 'CI-PR']
    types:
      - completed

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      checks: write
    steps:
      - run: sleep 10s
        name: wait for API&DB synchronized
      - name: Download artifact
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: result
      - name: Transform report file
        uses: MeilCli/common-lint-reporter/transformer/eslint@87cfd19be4fba8d5def898a488ed6b5ff62b2c32 # v1
        with:
          report_files: |
            eslint_report.json
      - name: Report lint result
        uses: MeilCli/common-lint-reporter@87cfd19be4fba8d5def898a488ed6b5ff62b2c32 # v1
        with:
          report_type: 'check_run'
          report_name: 'Lint Report'

name: Test file path upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test file
        run: |
          echo "This is a test file for upload" > /tmp/test-upload.txt
      - id: action
        uses: .
        with:
          slack_token: xoxb-dummy-token-for-testing
          channel_id: C0000000000
          file_path: /tmp/test-upload.txt
          file_name: test-upload.txt
          file_type: text
          title: "Test File Upload"
          retries: "1"
        continue-on-error: true
      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          # With a dummy token, the action should fail with an API error
          # but it should not crash with an unhandled exception
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded (unexpected with dummy token)"
            if [ -z "$RESPONSE" ]; then
              echo "FAIL: response output should not be empty on success"
              exit 1
            fi
          else
            echo "Action failed as expected with dummy token - graceful failure confirmed"
          fi
          echo "PASS"

name: Test file path upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test file
        run: |
          echo "This is a test file content" > /tmp/test-upload.txt
      - id: action
        uses: .
        with:
          slack_token: xoxb-invalid-token-for-testing
          channel_id: C0000000000
          file_path: /tmp/test-upload.txt
          file_name: test-upload.txt
          file_type: text
          title: "Test File Upload"
          retries: "1"
        continue-on-error: true
      - name: Assert action ran and produced an outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: expected outcome to be set"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
      - name: Assert action failed due to invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token (got $OUTCOME)"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"

name: Test no files found ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-fake-token-for-testing
          channel_id: C0000000000
          file_path: /tmp/nonexistent-file-that-does-not-exist.txt
          if_no_files_found: ignore
      - name: Assert action handled missing file gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (ignored missing file as expected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable outcome with fake token and missing file)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

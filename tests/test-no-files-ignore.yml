name: Test if_no_files_found ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          slack_token: xoxb-invalid-token-for-testing
          channel_id: C0000000000
          file_path: /nonexistent/path/to/file.txt
          if_no_files_found: ignore
      - name: Assert action completed without error when no files found and ignore is set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPLOADED_FILE_IDS: ${{ steps.action.outputs.uploaded_file_ids }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded_file_ids: $UPLOADED_FILE_IDS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (ignore mode) but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action completed successfully in ignore mode with no files found"

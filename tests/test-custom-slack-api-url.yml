name: Test custom slack_api_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: "xoxb-invalid-token-000000000000"
          slack_api_url: "https://slack.com/api/"
          content: "Hello from custom API URL test"
          file_name: "test.txt"
          retries: "0"
      - name: Assert action failed at API call (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          # With an invalid token, the Slack API call should fail
          # The action should fail (not succeed) because the token is invalid
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Slack token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using an invalid Slack token with custom api url"

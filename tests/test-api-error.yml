name: Test Slack API error fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Slack API (invalid_auth mode)
        run: |
          rm -f /tmp/slack-err.log
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_slack.py" 18733 /tmp/slack-err.log invalid_auth > /tmp/mock.out 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:18733/ >/dev/null && break
            sleep 0.5
          done
          curl -s http://127.0.0.1:18733/ || { cat /tmp/mock.out; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-bad-token
          slack_api_url: http://127.0.0.1:18733/api/
          channel_id: C0123456789
          content: should-fail
          retries: '0'
      - name: Assert failed and API was called
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IDS: ${{ steps.action.outputs.uploaded_file_ids }}
        run: |
          echo "outcome: $OUTCOME ids: '$IDS'"
          cat /tmp/slack-err.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on invalid_auth"
            exit 1
          fi
          if [ -n "$IDS" ]; then
            echo "FAIL: expected no ids"
            exit 1
          fi
          if ! grep -q '/api/' /tmp/slack-err.log; then
            echo "FAIL: mock API was not called"
            exit 1
          fi
          echo "PASS"

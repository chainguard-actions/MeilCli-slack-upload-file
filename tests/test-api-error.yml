name: Test Slack API error causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Slack API in error mode
        run: |
          rm -f /tmp/mock-slack-requests.log
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-slack-server.cjs" 8767 error > /tmp/mock-slack.out 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8767/health >/dev/null; then echo "mock up"; exit 0; fi
            sleep 1
          done
          echo "FAIL: mock server did not start"; cat /tmp/mock-slack.out; exit 1
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-invalid
          slack_api_url: http://127.0.0.1:8767/api/
          content: should fail
          retries: 0
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IDS: ${{ steps.action.outputs.uploaded_file_ids }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ids: $IDS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on invalid_auth"
            exit 1
          fi
          if [ -n "$IDS" ]; then
            echo "FAIL: expected no uploaded ids"
            exit 1
          fi
          echo "PASS"

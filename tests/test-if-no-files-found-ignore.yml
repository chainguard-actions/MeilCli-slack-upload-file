name: Test if_no_files_found ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-fake-token-for-testing
          channel_id: C0000000000
          file_path: /tmp/nonexistent-file-that-does-not-exist.txt
          if_no_files_found: ignore
      - name: Assert action did not fail due to missing file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With if_no_files_found=ignore, the action should either:
          # - succeed (ignoring the missing file, possibly skipping upload)
          # - fail only due to Slack API auth error (not due to missing file)
          # In either case, the action should not hard-fail due to missing file alone.
          # We accept both success and failure here since we can't distinguish
          # "ignored missing file" from "auth error" without a real token.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action handled missing file with if_no_files_found=ignore (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

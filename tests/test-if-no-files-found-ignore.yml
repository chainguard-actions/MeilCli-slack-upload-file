name: Test if_no_files_found ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: "xoxb-fake-token-for-testing"
          channel_id: "C0000000000"
          file_path: "/tmp/nonexistent-file-that-does-not-exist.txt"
          file_name: "missing.txt"
          if_no_files_found: "ignore"
          retries: "1"
      - name: Assert action ignored missing file gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          # With if_no_files_found=ignore, the action should succeed (skip upload)
          # or fail gracefully. It should NOT crash unexpectedly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (ignored missing file as expected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable outcome)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test delete_file_ids_before_upload via mock Slack API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Slack API
        run: |
          rm -f /tmp/mock-slack-requests.log
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-slack-server.cjs" 8770 ok > /tmp/mock-slack.out 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8770/health >/dev/null; then echo "mock up"; exit 0; fi
            sleep 1
          done
          echo "FAIL: mock server did not start"; cat /tmp/mock-slack.out; exit 1
      - id: action
        uses: .
        with:
          slack_token: xoxb-mock-token
          slack_api_url: http://127.0.0.1:8770/api/
          channel_id: C0MOCK
          content: replacement content
          file_name: replace.txt
          delete_file_ids_before_upload: FOLD0001,FOLD0002
          retries: 0
      - name: Assert old files deleted and new file uploaded
        env:
          IDS: ${{ steps.action.outputs.uploaded_file_ids }}
        run: |
          echo "ids: $IDS"
          echo "--- mock log ---"; cat /tmp/mock-slack-requests.log || true
          if [ "$IDS" != "F00MOCK1" ]; then
            echo "FAIL: expected uploaded_file_ids 'F00MOCK1'"
            exit 1
          fi
          for id in FOLD0001 FOLD0002; do
            if ! grep 'files.delete' /tmp/mock-slack-requests.log | grep -q "$id"; then
              echo "FAIL: files.delete not called for $id"
              exit 1
            fi
          done
          echo "PASS"

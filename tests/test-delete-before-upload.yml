name: Test delete_file_ids_before_upload input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-invalid-token-000000000000
          channel_id: C0000000000
          content: "Hello from delete-before-upload test"
          file_name: test.txt
          delete_file_ids_before_upload: "F0000000001,F0000000002"
          retries: "0"
      - name: Assert action ran (with delete_file_ids_before_upload input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With an invalid token, the action should fail (API error during delete or upload)
          # but the delete_file_ids_before_upload input was passed and exercised
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Slack token"
            exit 1
          fi
          echo "PASS: delete_file_ids_before_upload input exercised, action correctly failed with invalid token"

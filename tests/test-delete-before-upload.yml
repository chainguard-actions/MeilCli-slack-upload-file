name: Test delete_file_ids_before_upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Slack API
        run: |
          rm -f /tmp/slack-delete.log
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_slack.py" 18741 /tmp/slack-delete.log ok > /tmp/mock.out 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:18741/ >/dev/null && break
            sleep 0.5
          done
          curl -s http://127.0.0.1:18741/ || { cat /tmp/mock.out; exit 1; }
      - id: action
        uses: .
        with:
          slack_token: xoxb-test-token
          slack_api_url: http://127.0.0.1:18741/api/
          channel_id: C0123456789
          content: replacement-content
          file_name: replace.txt
          delete_file_ids_before_upload: FOLDA1,FOLDB2
          retries: '0'
      - name: Assert old files deleted and new file uploaded
        env:
          IDS: ${{ steps.action.outputs.uploaded_file_ids }}
        run: |
          echo "ids: $IDS"
          cat /tmp/slack-delete.log || true
          if [ "$IDS" != "FMOCK1" ]; then
            echo "FAIL: expected uploaded_file_ids 'FMOCK1'"
            exit 1
          fi
          if ! grep -q 'files.delete' /tmp/slack-delete.log; then
            echo "FAIL: files.delete was not called"
            exit 1
          fi
          for id in FOLDA1 FOLDB2; do
            if ! grep -q "$id" /tmp/slack-delete.log; then
              echo "FAIL: file id $id was not sent for deletion"
              exit 1
            fi
          done
          echo "PASS"

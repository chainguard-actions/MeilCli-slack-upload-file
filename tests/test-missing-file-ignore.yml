name: Test missing file with ignore option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: fake-token-for-testing
          channel_id: C0000000000
          file_path: /tmp/this-file-does-not-exist.txt
          file_name: "nonexistent.txt"
          if_no_files_found: ignore
      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With if_no_files_found=ignore, the action should either succeed (skip upload)
          # or fail gracefully (e.g. due to missing token after file check).
          # It must NOT produce an unexpected outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action handled missing file gracefully with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test content upload via mock Slack API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Slack API
        run: |
          rm -f /tmp/mock-slack-requests.log
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-slack-server.cjs" 8765 ok > /tmp/mock-slack.out 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health >/dev/null; then echo "mock up"; exit 0; fi
            sleep 1
          done
          echo "FAIL: mock server did not start"; cat /tmp/mock-slack.out; exit 1
      - id: action
        uses: .
        with:
          slack_token: xoxb-mock-token
          slack_api_url: http://127.0.0.1:8765/api/
          channel_id: C0MOCK
          content: hello from act test
          file_name: hello.txt
          title: Hello
          retries: 0
      - name: Assert outputs
        env:
          IDS: ${{ steps.action.outputs.uploaded_file_ids }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "ids: $IDS"
          echo "response: $RESPONSE"
          echo "--- mock log ---"; cat /tmp/mock-slack-requests.log || true
          if [ "$IDS" != "F00MOCK1" ]; then
            echo "FAIL: expected uploaded_file_ids 'F00MOCK1'"
            exit 1
          fi
          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "FAIL: response does not contain ok:true"
            exit 1
          fi
          if ! grep -q 'UPLOAD_BODY /upload/F00MOCK1 .*hello from act test' /tmp/mock-slack-requests.log; then
            echo "FAIL: uploaded content not seen by mock"
            exit 1
          fi
          if ! grep -q 'files.completeUploadExternal' /tmp/mock-slack-requests.log; then
            echo "FAIL: completeUploadExternal not called"
            exit 1
          fi
          echo "PASS"

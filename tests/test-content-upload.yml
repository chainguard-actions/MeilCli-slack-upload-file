name: Test content upload with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-invalid-token-for-testing
          channel_id: C0000000000
          content: "Hello from act test"
          file_name: test.txt
          title: "Test Upload"
          initial_comment: "Test comment"
          retries: "1"
      - name: Assert response output is set
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          # The action should have run and either succeeded or failed with an API error
          # With an invalid token, we expect it to fail (outcome=failure) or return an error response
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded (unexpected with invalid token, but checking response)"
            if [ -z "$RESPONSE" ]; then
              echo "FAIL: response output should not be empty on success"
              exit 1
            fi
            echo "PASS: response is set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid token"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

name: Test content upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          slack_token: xoxb-dummy-token-for-testing
          channel_id: C0000000000
          content: "Hello from test"
          file_name: test.txt
          title: "Test Upload"
          initial_comment: "Test comment"
        continue-on-error: true
      - name: Assert response output is set
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          # The action should either succeed or fail with an API error response
          # but the response output should be set (even if it's an error)
          # With a dummy token, we expect the action to fail (API error)
          # but it should still produce some output or fail gracefully
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded (unexpected with dummy token, but ok)"
            if [ -z "$RESPONSE" ]; then
              echo "FAIL: response output should not be empty on success"
              exit 1
            fi
          else
            echo "Action failed as expected with dummy token"
          fi
          echo "PASS"

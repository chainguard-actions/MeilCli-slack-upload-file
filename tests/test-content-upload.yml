name: Test content upload to Slack
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: "xoxb-fake-token-for-testing"
          channel_id: "C0000000000"
          content: "Hello from act test!"
          file_name: "test.txt"
          title: "Test Upload"
          initial_comment: "This is a test upload"
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
          FILE_IDS: ${{ steps.action.outputs.uploaded_file_ids }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          echo "uploaded_file_ids: $FILE_IDS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESPONSE" ]; then
              echo "FAIL: action succeeded but response output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with response: $RESPONSE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

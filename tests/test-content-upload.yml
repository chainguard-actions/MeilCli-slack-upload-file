name: Test content input upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: "xoxb-placeholder-token-not-real"
          channel_id: "C0000000000"
          content: "Hello from test content upload"
          file_name: "test-content.txt"
          file_type: "text"
          title: "Test Content Upload"
          initial_comment: "Uploaded via content input"
          retries: "1"
      - name: Assert action ran with content input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: '$RESPONSE'"
          # The action should either succeed (if API is reachable) or fail with
          # an auth/API error — but it must NOT fail due to missing content input.
          # A failure due to "content" not being recognized would show a different
          # error. We accept both success and failure outcomes here since we're
          # using a placeholder token; what matters is the content input was consumed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and processed content input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

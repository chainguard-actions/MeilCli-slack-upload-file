name: Test content upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: ${{ secrets.SLACK_TOKEN || 'xoxb-test-invalid-token' }}
          channel_id: 'C0000000000'
          content: 'Hello from act test'
          file_name: 'test.txt'
          title: 'Test Upload'
          initial_comment: 'Automated test upload'
      - name: Assert action ran and produced outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          # The action should either succeed (with a real token) or fail with an API error
          # Either way, it should have run and produced some output or a clear error
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$RESPONSE" ]; then
              echo "FAIL: expected response output to be non-empty on success"
              exit 1
            fi
            echo "PASS: action succeeded with response"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected with invalid/missing token)"
            echo "PASS: action ran and failed as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

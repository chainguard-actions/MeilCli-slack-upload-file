name: Test file not found with error option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          slack_token: xoxb-invalid-token-for-testing
          channel_id: C0000000000
          file_path: /tmp/nonexistent-file-that-does-not-exist-xyz.txt
          if_no_files_found: error
          retries: "1"
        continue-on-error: true
      - name: Assert action failed when file not found with error option
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: action should fail when if_no_files_found=error and file does not exist (got $OUTCOME)"
            exit 1
          fi
          echo "PASS: action correctly failed when file not found with error option"

name: Test if_no_files_found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: "xoxb-placeholder-token-not-used"
          file_path: "/nonexistent/path/that/does/not/exist/*.txt"
          if_no_files_found: "error"
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          # When if_no_files_found=error (or default) and no files found,
          # the action should fail with an error
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected when no files found with error mode"

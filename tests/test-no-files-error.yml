name: Test missing files errors by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-test-token
          slack_api_url: http://127.0.0.1:1/api/
          channel_id: C0123456789
          file_path: /tmp/does-not-exist-dir/*.nothing
          retries: '0'
      - name: Assert failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no files are found"
            exit 1
          fi
          echo "PASS"

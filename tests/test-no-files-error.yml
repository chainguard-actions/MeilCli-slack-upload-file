name: Test if_no_files_found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-invalid-token-for-testing
          channel_id: C0000000000
          file_path: /nonexistent/path/to/file.txt
          if_no_files_found: error
      - name: Assert action failed when no files found and error mode is set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in error mode with no files found, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed in error mode when no files found"

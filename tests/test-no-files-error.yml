name: Test if_no_files_found error (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: "xoxb-fake-token-for-no-files-test"
          file_path: "/nonexistent/path/that/does/not/exist/*.json"
          if_no_files_found: error
      - name: Assert action failed when files not found with error setting
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when if_no_files_found=error and no files exist, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when files were not found with error setting"

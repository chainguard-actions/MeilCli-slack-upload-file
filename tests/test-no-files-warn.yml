name: Test if_no_files_found warn
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          slack_token: xoxb-unused
          slack_api_url: http://127.0.0.1:1/api/
          file_path: /tmp/definitely-does-not-exist-dir/*.txt
          if_no_files_found: warn
          retries: 0
      - name: Assert succeeded with no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IDS: ${{ steps.action.outputs.uploaded_file_ids }}
        run: |
          echo "outcome: $OUTCOME ids: '$IDS'"
          if [ "$OUTCOME" != "success" ]; then echo "FAIL: expected success"; exit 1; fi
          if [ -n "$IDS" ]; then echo "FAIL: expected empty ids"; exit 1; fi
          echo "PASS"

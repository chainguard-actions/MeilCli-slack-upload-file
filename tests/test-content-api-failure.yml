name: Test content upload path - API failure with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-invalid-token-000000000000
          content: "Hello from test"
          file_name: test.txt
          retries: "0"
      - name: Assert action failed due to API error (not file-not-found)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Slack token"
            exit 1
          fi
          echo "PASS: action correctly failed when using an invalid Slack token (API error path exercised)"

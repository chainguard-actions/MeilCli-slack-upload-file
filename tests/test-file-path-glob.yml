name: Test multiple file upload via glob with mock Slack API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Slack API and create files
        run: |
          rm -f /tmp/mock-slack-requests.log
          mkdir -p /tmp/upload-files
          echo "first-file-content" > /tmp/upload-files/a.txt
          echo "second-file-content" > /tmp/upload-files/b.txt
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-slack-server.cjs" 8766 ok > /tmp/mock-slack.out 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8766/health >/dev/null; then echo "mock up"; exit 0; fi
            sleep 1
          done
          echo "FAIL: mock server did not start"; cat /tmp/mock-slack.out; exit 1
      - id: action
        uses: .
        with:
          slack_token: xoxb-mock-token
          slack_api_url: http://127.0.0.1:8766/api/
          channel_id: C0MOCK
          file_path: /tmp/upload-files/*.txt
          initial_comment: two files
          retries: 0
      - name: Assert two files uploaded
        env:
          IDS: ${{ steps.action.outputs.uploaded_file_ids }}
        run: |
          echo "ids: $IDS"
          echo "--- mock log ---"; cat /tmp/mock-slack-requests.log || true
          COUNT=$(echo "$IDS" | tr ',' '\n' | grep -c '^F00MOCK[0-9]*$' || true)
          if [ "$COUNT" != "2" ]; then
            echo "FAIL: expected 2 uploaded file ids, got $COUNT"
            exit 1
          fi
          if ! grep -q 'first-file-content' /tmp/mock-slack-requests.log || ! grep -q 'second-file-content' /tmp/mock-slack-requests.log; then
            echo "FAIL: file contents not uploaded"
            exit 1
          fi
          echo "PASS"

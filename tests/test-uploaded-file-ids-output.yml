name: Test uploaded_file_ids output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: ${{ secrets.SLACK_TOKEN || 'xoxb-test-invalid-token' }}
          channel_id: 'C0000000000'
          content: 'Test content for file ids output verification'
          file_name: 'test-ids.txt'
          title: 'Test File IDs Output'
      - name: Assert outputs are defined
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
          FILE_IDS: ${{ steps.action.outputs.uploaded_file_ids }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          echo "uploaded_file_ids: $FILE_IDS"
          if [ "$OUTCOME" = "success" ]; then
            # On success, both outputs should be populated
            if [ -z "$RESPONSE" ]; then
              echo "FAIL: expected response output to be non-empty on success"
              exit 1
            fi
            if [ -z "$FILE_IDS" ]; then
              echo "FAIL: expected uploaded_file_ids output to be non-empty on success"
              exit 1
            fi
            echo "PASS: both response and uploaded_file_ids outputs are populated"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected with invalid/missing token)"
            echo "PASS: action ran and failed as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

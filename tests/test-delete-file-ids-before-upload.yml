name: Test delete_file_ids_before_upload input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with delete_file_ids_before_upload input
        id: action
        uses: .
        with:
          slack_token: xoxb-invalid-token-for-testing
          channel_id: C0000000000
          content: "Replacement file content"
          file_name: replacement.txt
          delete_file_ids_before_upload: "F0000000001,F0000000002"
          retries: "1"
        continue-on-error: true
      - name: Assert action ran (not skipped) when delete_file_ids_before_upload is provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should attempt deletion + upload (failing due to invalid
          # token) but must not be skipped — confirming the input was accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with delete_file_ids_before_upload input (outcome=$OUTCOME)"

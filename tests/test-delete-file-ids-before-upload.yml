name: Test delete_file_ids_before_upload input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: fake-token-for-coverage
          channel_id: C0000000000
          content: "Test content for delete_file_ids_before_upload coverage"
          delete_file_ids_before_upload: "F0000000001,F0000000002"
      - name: Assert action ran (delete_file_ids_before_upload input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESPONSE" ]; then
              echo "FAIL: action succeeded but response output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with response: $RESPONSE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without a real Slack token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

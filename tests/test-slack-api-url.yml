name: Test slack_api_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with custom slack_api_url input
        id: action
        uses: .
        with:
          slack_token: xoxb-invalid-token-for-testing
          slack_api_url: https://slack.example.invalid/api/
          channel_id: C0000000000
          content: "Hello from slack_api_url test"
          file_name: test.txt
          retries: "1"
        continue-on-error: true
      - name: Assert action ran (not skipped) when slack_api_url is provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should attempt to call the custom API URL and fail
          # (invalid URL / token), but it must not be skipped (i.e. the input
          # was accepted and the action ran).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with slack_api_url input (outcome=$OUTCOME)"

name: Test file upload with invalid token fails at API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test file to upload
        run: |
          echo "This is a test file content" > /tmp/test-upload.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: "xoxb-invalid-token-000000000000"
          file_path: "/tmp/test-upload.txt"
          file_name: "test-upload.txt"
          title: "Test File Upload"
          retries: "0"
      - name: Assert action failed at API call (not at file reading)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With an invalid token, the Slack API call should fail
          # The action should fail because the token is invalid, not because the file is missing
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Slack token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using an invalid Slack token with a real file"

name: Test missing file with warn option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: fake-token-for-testing
          channel_id: C0000000000
          file_path: /tmp/this-file-does-not-exist.txt
          file_name: "nonexistent.txt"
          if_no_files_found: warn
      - name: Assert action succeeded (warned but did not fail) for missing file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With if_no_files_found=warn and a missing file, the action should succeed
          # (emit a warning but not exit with error)
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (warn only) when file is missing and if_no_files_found=warn, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly warned (did not fail) when file was not found with if_no_files_found=warn"

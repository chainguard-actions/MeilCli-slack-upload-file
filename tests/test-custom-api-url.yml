name: Test custom slack_api_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-invalid-token-000000000000
          slack_api_url: https://slack.com/api/
          channel_id: C0000000000
          content: "Hello from custom API URL test"
          file_name: test.txt
          retries: "0"
      - name: Assert action ran (with custom api url input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With an invalid token, the action should fail (API error)
          # but the slack_api_url input was passed and exercised
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Slack token"
            exit 1
          fi
          echo "PASS: slack_api_url input exercised, action correctly failed with invalid token"

name: Test content upload with custom slack_api_url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-fake-token-for-testing
          slack_api_url: https://slack.example.invalid/api/
          content: "Hello from custom API URL test"
          file_name: test.txt
          title: Test Custom API URL
          retries: 0
      - name: Assert action failed due to invalid API URL or auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          # With a fake token and/or invalid API URL, the action should fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake token/invalid API URL but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using a custom (invalid) slack_api_url"

name: Test thread_ts input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: 'xoxb-fake-token-for-testing'
          channel_id: 'C0000000000'
          content: 'test content for thread_ts coverage'
          thread_ts: '1234567890.123456'
          title: 'Test thread_ts input'
      - name: Assert action ran with thread_ts input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the token is fake,
          # but we verify the input was accepted (not an input validation error)
          # The action should have run and attempted the API call
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with thread_ts input"

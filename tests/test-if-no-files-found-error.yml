name: Test if_no_files_found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: "xoxb-fake-token-for-testing"
          channel_id: "C0000000000"
          file_path: "/tmp/nonexistent-file-that-does-not-exist.txt"
          file_name: "missing.txt"
          if_no_files_found: "error"
          retries: "1"
      - name: Assert action failed due to missing file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With if_no_files_found=error, the action should fail when file is missing
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when file not found with error mode"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when file not found with error mode"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

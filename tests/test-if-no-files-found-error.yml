name: Test if_no_files_found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_token: xoxb-fake-token-for-testing
          channel_id: C0000000000
          file_path: /tmp/nonexistent-file-that-does-not-exist.txt
          if_no_files_found: error
      - name: Assert action failed due to missing file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With if_no_files_found=error and a missing file, the action must fail.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when file not found and if_no_files_found=error"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when file is missing and if_no_files_found=error"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test if_no_files_found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          slack_token: xoxb-dummy-token-for-testing
          channel_id: C0000000000
          file_path: /tmp/nonexistent-file-that-does-not-exist.txt
          if_no_files_found: error
        continue-on-error: true
      - name: Assert action failed when file not found with error mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when file not found and if_no_files_found=error"
            exit 1
          fi
          echo "PASS: action correctly failed when file not found with if_no_files_found=error"

name: Test thread reply upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Slack API server
        run: |
          python3 "$GITHUB_WORKSPACE/tests/fixtures/mock-slack-server.py" 3003 &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          # Wait for server to be ready
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3003/ > /dev/null 2>&1; then
              echo "Mock server is ready"
              break
            fi
            sleep 1
          done
      - id: action
        uses: .
        with:
          slack_token: "xoxb-dummy-token-for-testing"
          slack_api_url: "http://localhost:3003/api/"
          channel_id: "C12345"
          content: "Thread reply test content from act"
          file_name: "thread-reply.txt"
          title: "Act Test - Thread Reply"
          thread_ts: "1234567890.123456"
          initial_comment: "This file is a reply in a thread"
      - name: Assert response is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.response }}
        run: |
          echo "actual response: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected a non-empty response"
            exit 1
          fi
          echo "PASS: got response"
      - name: Assert uploaded_file_ids is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.uploaded_file_ids }}
        run: |
          echo "actual uploaded_file_ids: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected uploaded_file_ids to be non-empty"
            exit 1
          fi
          echo "PASS: got uploaded_file_ids: $ACTUAL"
      - name: Stop mock server
        if: always()
        run: |
          if [ -n "$MOCK_PID" ]; then
            kill "$MOCK_PID" 2>/dev/null || true
          fi
